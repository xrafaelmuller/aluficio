<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ALUFICIO — Em desenvolvimento." />
  <title>ALUFICIO</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭐</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-start:  #020617;
      --bg-mid:    #0c1a3a;
      --bg-end:    #0f172a;
      --primary:   #38bdf8;
      --primary-2: #22d3ee;
      --text:      #f1f5f9;
      --muted:     #94a3b8;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg-start);
      color: var(--text);
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(56,189,248,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 80%, rgba(129,140,248,0.10) 0%, transparent 55%),
        radial-gradient(ellipse 50% 40% at 50% 50%, rgba(34,211,238,0.06) 0%, transparent 70%),
        linear-gradient(160deg, var(--bg-start) 0%, var(--bg-mid) 50%, var(--bg-end) 100%);
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(56,189,248,0.07) 0%, transparent 70%);
      top: -150px;
      left: -100px;
      animation: drift 18s ease-in-out infinite alternate;
      z-index: 0;
    }

    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(80px, 60px) scale(1.1); }
    }

    .grid-overlay {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(56,189,248,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56,189,248,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      text-align: center;
    }

    .logo {
      font-size: clamp(3.5rem, 12vw, 7rem);
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1;
      background: linear-gradient(135deg, #f1f5f9 0%, var(--primary) 50%, var(--primary-2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 40px rgba(56,189,248,0.25));
    }

    .dev-block {
      margin-top: 2.75rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
    }

    .dev-dots {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
    }

    .dev-dots span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      animation: dev-pulse 1.25s ease-in-out infinite;
      opacity: 0.45;
    }

    .dev-dots span:nth-child(2) { animation-delay: 0.2s; }
    .dev-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dev-pulse {
      0%, 100% { transform: scale(1); opacity: 0.35; }
      50%      { transform: scale(1.25); opacity: 1; }
    }

    .dev-label {
      font-size: clamp(0.8rem, 2vw, 0.95rem);
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .page > * {
      animation: fade-up 0.7s cubic-bezier(0.4, 0, 0.2, 1) both;
    }

    .page > *:nth-child(2) { animation-delay: 0.12s; }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    footer {
      position: relative;
      z-index: 1;
      padding: 1.5rem;
      color: rgba(148,163,184,0.45);
      font-size: 0.75rem;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div class="grid-overlay"></div>

  <main class="page">
    <div class="logo">ALUFICIO</div>

    <div class="dev-block">
      <p class="dev-label">Desenvolvimento</p>
      <div class="dev-dots" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>
    </div>
  </main>

  <footer>
    &copy; 2026 ALUFICIO. Todos os direitos reservados.
  </footer>
</body>
</html>
